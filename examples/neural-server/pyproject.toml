[project]
name = "t3d-neural-server"
version = "0.1.0"
description = "Reference t3d-neural/1 model server for ts23d (example; not shipped in the npm package)"
requires-python = ">=3.11"
license = "MIT"
# The server alone. Model plug-ins import their own stacks (torch, diffusers, the model repo) at
# load time from the environment they run in: see README "GPU setup".
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "httpx2>=2.16,<3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
