# yaml-language-server: $schema=https://developerz.ai/schemas/maintainer.v1.json
# developerz.ai maintainer policy for developerz-ai/ts23d.
#
# As of 2026-11 the bot reviews every pull request and runs the checkups in `schedules:`, which
# only file issues and small upkeep PRs. Triage, merging and releases stay with members until the
# project leaves 0.x — widen this file, not the bot's habits.
# Docs: https://developerz.ai/docs/maintainer-yml
version: 1

tone:
  voice: friendly
  language: en

review:
  force: true

pr:
  required_checks: [verify]
  require_review: true
  auto_merge: false

release:
  manager: none
  channels: []

schedules:
  # Judge and file only: a release still needs a member to merge `chore: release x.y.z`.
  - name: release-due
    days: [wed]
    hours_utc: [3]
    brief_file: .dz/briefs/release-due.md
  - name: health
    days: [mon, tue, wed, thu, fri, sat, sun]
    hours_utc: [7]
    brief_file: .dz/briefs/health.md
  - name: improve
    days: [mon]
    hours_utc: [8]
    brief_file: .dz/briefs/improve.md
