name: pages

# The demo gallery at https://developerz-ai.github.io/ts23d/ — the site compiles every recipe in
# the browser; the contact sheets ship beside it under /renders/. Deploys from main only.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun run site:build
      - name: contact sheets → /renders/<asset>.png
        run: |
          set -euo pipefail
          bun run src/cli/bin.ts shot recipes/*.ts --out "$RUNNER_TEMP/shots" || true
          mkdir -p apps/site/dist/renders
          for d in "$RUNNER_TEMP"/shots/*/; do
            n="$(basename "$d")"
            [ -f "$d/sheet.png" ] && cp "$d/sheet.png" "apps/site/dist/renders/$n.png"
          done
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
