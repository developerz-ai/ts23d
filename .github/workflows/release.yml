name: release

# npm publish via OIDC trusted publishing — no NPM_TOKEN exists. Runs only from a vX.Y.Z tag
# whose commit is on main and has a successful ci push run, only with the tree stamped at that
# version, and only after the whole gate (`bun run verify`, every step, unsharded) passes again
# here. The publish job restores no cache (a PR job could have written it) and is the only holder
# of id-token. One-time bootstrap + trusted-publisher setup: PUBLISHING.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (must equal package.json at the selected tag)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45 # the unsharded recipes step alone is ~9 minutes
    permissions:
      contents: read
      actions: read # gh run list: the tag commit's ci runs
    steps:
      - name: refuse anything but a release tag
        env:
          REF: ${{ github.ref }}
          INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          case "$REF" in
            "refs/tags/v${INPUT#v}") echo "ok: $REF" ;;
            *) echo "::error::publish runs from tag v${INPUT#v} only (got $REF). fix: gh workflow run release.yml --ref v${INPUT#v} -f version=${INPUT#v}"; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # origin/main, for the ancestry check
          persist-credentials: false
      - name: refuse a tag that is not on a green main commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::$SHA is not on main. fix: release only through a merged 'chore: release x.y.z' PR (PUBLISHING.md)"
            exit 1
          fi
          green="$(gh run list --workflow ci.yml --commit "$SHA" --branch main --event push --status success --json databaseId --jq length)"
          if [ "$green" -eq 0 ]; then
            echo "::error::no successful ci push run on $SHA. fix: wait for (or re-run) ci on main for that commit, then gh workflow run release.yml --ref <tag> -f version=<x.y.z>"
            exit 1
          fi
          echo "ok: $SHA is on main with $green green ci run(s)"
      - uses: ./.github/actions/setup
      - name: tree is stamped at the version
        env:
          VERSION: ${{ inputs.version }}
        run: bun run scripts/release.ts --check "$VERSION"
      - run: bun run verify

  publish:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # OIDC: npm mints a short-lived publish token from this run + provenance
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/@developerz.ai/ts23d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11.5.2 # trusted publishing needs npm >= 11.5.1
      - run: bun install --frozen-lockfile --ignore-scripts
      # npm publish runs `prepack` (= bun run build), so dist/ is built from this checkout.
      - run: npm publish --access public --provenance
