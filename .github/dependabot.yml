version: 2

# Grouped, with a 14-day cooldown: most yanked versions and supply-chain incidents surface inside
# that window. Cadence follows developerz-ai/wurk: the shipped and build dependencies move weekly;
# the CI actions move monthly (a weekly cadence there is mostly one PR per patch for no change in
# what ships). Bun itself is pinned by .bun-version and moved by the monthly `cleanup` checkup
# (`toolchain` row), measured with the full gate and `bun run shots`. Every PR here is merged by the
# AI maintainer on a green `verify`.

updates:
  - package-ecosystem: bun
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 14 }
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message: { prefix: 'chore(deps)' }
    groups:
      tooling:
        patterns: ['@biomejs/*', 'typescript', 'lefthook', '@types/*', 'vite']
      runtime:
        patterns: ['*']
        exclude-patterns: ['@biomejs/*', 'typescript', 'lefthook', '@types/*', 'vite']

  - package-ecosystem: github-actions
    directories: ['/', '/.github/actions/*']
    schedule: { interval: monthly }
    cooldown: { default-days: 14 }
    labels: [dependencies, ci]
    commit-message: { prefix: 'chore(ci)' }
    groups:
      actions:
        patterns: ['*']
